[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-voice-agent"
version = "0.1.0"
description = "A voice grocery ordering agent prototype"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.26.0,<7.0",
    "openai>=3.5.0,<4.0",
]

[project.scripts]
grocery-agent-web = "grocery_agent.gradio_app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
